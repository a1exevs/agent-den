<div class="alerts" role="group" aria-label="Alerts">
  <den-toggle [pressed]="settings.sound()" [hint]="soundHint()" (pressedChange)="onSoundChange($event)">
    @if (settings.soundBlocked()) {
      🔇 click to unmute
    } @else {
      🔊 sound
    }
  </den-toggle>
  <den-toggle
    [pressed]="settings.notifications()"
    [disabled]="notificationsBlocked()"
    [hint]="notificationsHint()"
    (pressedChange)="onNotificationsChange($event)"
  >
    🔔 notifications
  </den-toggle>
</div>
