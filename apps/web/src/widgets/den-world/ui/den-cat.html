@if (bubble(); as text) {
  <span class="cat__bubble">{{ text }}</span>
}
<den-agent-avatar
  class="cat__sprite"
  [agent]="agent()"
  [skin]="skin()"
  [action]="action()"
  [scale]="scale()"
  [flip]="facingLeft()"
/>
<span class="cat__labels">
  <span class="cat__name">{{ name() }}</span>
  @if (agent().title; as title) {
    <span class="cat__title" [attr.title]="title">{{ title }}</span>
  }
  <span class="cat__caption">{{ caption() }}</span>
</span>
